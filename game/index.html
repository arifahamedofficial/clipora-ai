<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b18"><title>Neon Dash — Arcade Game</title>
<style>
:root{color-scheme:dark;--bg:#090b18;--panel:#12162a;--cyan:#54f3e5;--pink:#ff4d9d;--muted:#9ba6c8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#20234a 0,#0c1022 45%,#070914 100%);font-family:Inter,system-ui,Segoe UI,sans-serif;color:#f5f7ff;display:grid;place-items:center;padding:22px}
.wrap{width:min(920px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.brand{font-size:13px;letter-spacing:.28em;color:var(--cyan);font-weight:900}.tag{font-size:12px;color:var(--muted);border:1px solid #343b5d;border-radius:99px;padding:7px 12px}
h1{font-size:clamp(34px,7vw,64px);letter-spacing:-.06em;margin:0;line-height:1}.sub{color:var(--muted);margin:9px 0 22px}
.gamebox{background:linear-gradient(145deg,#171b34,#0d1022);border:1px solid #343b5d;border-radius:22px;padding:14px;box-shadow:0 25px 90px #0009}
.hud{display:flex;justify-content:space-between;align-items:center;padding:3px 6px 13px;gap:12px}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em}.stat strong{font-size:23px;font-variant-numeric:tabular-nums}.best{color:var(--cyan)}
canvas{width:100%;display:block;border-radius:13px;background:#090d20;touch-action:manipulation}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 5px 3px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted)}
button{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(100deg,var(--cyan),#8cffe7);color:#07131b;font-weight:900;cursor:pointer;box-shadow:0 5px 24px #54f3e533}button:active{transform:translateY(1px)}.jump{background:linear-gradient(100deg,#ff4d9d,#ff9bcb);color:#220818}
footer{text-align:center;color:#7782a5;font-size:11px;margin-top:14px}
@media(max-width:560px){body{padding:12px}.gamebox{padding:9px;border-radius:17px}.stat strong{font-size:19px}.controls{align-items:stretch}.hint{width:100%;text-align:center}.controls button{flex:1}}
</style></head>
<body><main class="wrap">
<header><div class="brand">ARCADE / 001</div><div class="tag">NO DOWNLOAD · PLAY IN BROWSER</div></header>
<h1>NEON <span style="color:var(--cyan)">DASH</span></h1><p class="sub">One run. Endless obstacles. How far can you go?</p>
<section class="gamebox">
<div class="hud"><div class="stat"><small>SCORE</small><strong id="score">0000</strong></div><div class="stat" style="text-align:right"><small>BEST RUN</small><strong class="best" id="best">0000</strong></div></div>
<canvas id="game" width="900" height="430" aria-label="Neon Dash game area"></canvas>
<div class="controls"><span class="hint">SPACE / ↑ / TAP TO JUMP · Avoid the red blocks</span><button class="jump" id="jump">JUMP ↗</button><button id="restart">↻ RESTART</button></div>
</section><footer>NEON DASH · BUILT FOR DESKTOP & MOBILE</footer></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const W=900,H=430,ground=345;let player,obstacles,particles,score,best=Number(localStorage.getItem('neonDashBest')||0),speed,frame,playing,dead,started;
bestEl.textContent=String(best).padStart(4,'0');
function reset(){player={x:112,y:ground-48,w:38,h:48,vy:0,grounded:true};obstacles=[];particles=[];score=0;speed=6;frame=0;playing=true;dead=false;started=true;scoreEl.textContent='0000';}
function jump(){if(!started){reset();return}if(dead){reset();return}if(player.grounded){player.vy=-15.5;player.grounded=false;for(let i=0;i<7;i++)particles.push({x:player.x+15,y:ground-4,vx:(Math.random()-.5)*4,vy:-Math.random()*3-1,life:24});}}
function rect(x,y,w,h,color,glow){ctx.save();ctx.shadowBlur=glow||0;ctx.shadowColor=color;ctx.fillStyle=color;ctx.fillRect(x,y,w,h);ctx.restore();}
function draw(){
ctx.clearRect(0,0,W,H);
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101632');g.addColorStop(1,'#090d1d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<65;i++){let x=(i*137+frame*.25)%W,y=(i*71)%285;ctx.fillStyle='rgba(160,190,255,.35)';ctx.fillRect(x,y,2,2)}
ctx.strokeStyle='rgba(84,243,229,.08)';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x-90,H);ctx.stroke()}
rect(0,ground,W,3,'#54f3e5',12);ctx.fillStyle='#121a32';ctx.fillRect(0,ground+3,W,H-ground);
for(let x=-(frame*speed*.8%80);x<W;x+=80)rect(x,ground+24,38,2,'#263451');
if(player){
 // shadow
 ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(player.x+19,ground+5,26,5,0,0,Math.PI*2);ctx.fill();
 // glowing runner
 ctx.save();ctx.shadowBlur=22;ctx.shadowColor='#54f3e5';ctx.fillStyle='#54f3e5';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();
 ctx.fillStyle='#102033';ctx.fillRect(player.x+23,player.y+10,7,7);rect(player.x+5,player.y+player.h-7,28,5,'#eaffff',8);
}
obstacles.forEach(o=>{rect(o.x,o.y,o.w,o.h,'#ff4d9d',18);rect(o.x+5,o.y+7,4,o.h-14,'#ffc1df',4)});
particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/24);rect(p.x,p.y,4,4,'#54f3e5',5);ctx.globalAlpha=1});
if(!started){overlay('READY TO RUN','Press SPACE or tap JUMP to start')}
else if(dead){overlay('RUN OVER','Tap RESTART or press SPACE to try again')}
else if(score<1){ctx.fillStyle='rgba(220,230,255,.65)';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('JUMP OVER THE NEON BLOCKS',W/2,70)}
}
function overlay(title,sub){ctx.fillStyle='rgba(4,7,18,.62)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.shadowBlur=20;ctx.shadowColor='#54f3e5';ctx.fillStyle='#f5f7ff';ctx.font='900 42px system-ui';ctx.fillText(title,W/2,185);ctx.shadowBlur=0;ctx.fillStyle='#aeb9da';ctx.font='16px system-ui';ctx.fillText(sub,W/2,220)}
function collide(a,b){return a.x+7<b.x+b.w-5&&a.x+a.w-6>b.x+5&&a.y+5<b.y+b.h&&a.y+a.h>b.y+5}
function loop(){
 if(playing&&!dead){frame++;score+=.12;speed=Math.min(12,6+score/100);scoreEl.textContent=String(Math.floor(score)).padStart(4,'0');
 player.vy+=.72;player.y+=player.vy;if(player.y+player.h>=ground){player.y=ground-player.h;player.vy=0;player.grounded=true}
 if(frame%Math.max(48,Math.floor(95-score/4))===0){let h=34+Math.random()*45;obstacles.push({x:W+15,y:ground-h,w:25+Math.random()*16,h})}
 obstacles.forEach(o=>o.x-=speed);obstacles=obstacles.filter(o=>o.x+o.w>-10);
 particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0);
 if(obstacles.some(o=>collide(player,o))){dead=true;playing=false;if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('neonDashBest',best);bestEl.textContent=String(best).padStart(4,'0')}}
 }
 draw();requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}});
canvas.addEventListener('pointerdown',jump);document.getElementById('jump').addEventListener('click',jump);document.getElementById('restart').addEventListener('click',reset);
draw();loop();
})();
</script></body></html>
